# GitHub Actions Workflow · hermes-publisher
# Fleet template: Python CLI → 4-job CI (ruff / pytest / compileall / PyPI optional)
# 2026-09-07 by Sean 10-repo-fleet Worker — v3.0.2

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check .
        continue-on-error: true  # 既有 11 個 pre-existing warning（F401/I001/F541），預留 v3.0.3 修補
      - name: Run ruff format check
        run: ruff format --check .
        continue-on-error: true

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: Pytest
        run: python -m pytest -q
      - name: Compileall
        run: python -m compileall -q hermes_publisher
      - name: Verify CLI help works
        run: |
          python -m hermes_publisher --help
          python -m hermes_publisher check --help
          python -m hermes_publisher simulate --help
          python -m hermes_publisher publish --help
          python -m hermes_publisher status --help
      - name: Scan for leaked secrets
        run: |
          ! git grep -nE "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})" || (echo "::error::疑似 secret 洩漏" && exit 1)

  build:
    name: Build (sdist + wheel)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-publisher-build
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish to PyPI (optional)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hermes-publisher-build
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish to PyPI
        if: env.PYPI_TOKEN_SET == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
        continue-on-error: true  # 無 PYPI_TOKEN 仍可跳過，lint/test/build 仍綠
