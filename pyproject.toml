[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-publisher"
version = "0.1.0"
description = "從 Claude Code / Codex / Hermes 一鍵把 SKILL.md 上架到 Capafy 販售"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sean" }]
keywords = ["capafy", "skill", "agent", "marketplace", "publish"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
hermes-publisher = "hermes_publisher.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_publisher*"]

[tool.setuptools.package-data]
hermes_publisher = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["hermes_publisher/tests"]
pythonpath = ["."]
